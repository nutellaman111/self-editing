<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Editing Page</title>
    <link rel="stylesheet" href="ace.css" />
  </head>
  <body>
    <div id="updateBarContainer">
      <div id="updateBar">Updating in 0.0s</div>
    </div>
    <div id="editor"></div>

    <script>
      function applyStyles() {
        Object.assign(document.documentElement.style, {
          margin: "0",
          height: "100%",
          width: "100%",
        });

        Object.assign(document.body.style, {
          margin: "0",
          height: "100%",
          width: "100%",
        });

        Object.assign(document.getElementById("editor").style, {
          height: "100%",
          width: "100%",
          fontSize: "1.25rem",
        });

        Object.assign(document.getElementById("updateBarContainer").style, {
          position: "sticky",
          width: "100%",
          height: "50px",
          background: "#333",
          color: "#fff",
          fontFamily: "monospace",
          display: "flex",
          alignItems: "center",
          zIndex: "100",
        });

        Object.assign(document.getElementById("updateBar").style, {
          height: "100%",
          width: "0",
          background: "#4caf50",
          transition: "width 0.1s linear",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
        });
      }

      function replaceVariablesInHTML(html, replacements) {
        replacements.forEach(({ name, value }) => {
          const regex = new RegExp(`let\\s+${name}\\s*=\\s*[^;]*;`);
          html = html.replace(regex, `let ${name} = ${value};`);
        });
        return html;
      }

      function yeah() {
        let cursorPos = 0;
        let scrollTop = 0;
        let initialHTML = document.documentElement.outerHTML;

        applyStyles();

        const aceScript = document.createElement("script");
        aceScript.src =
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js";

        aceScript.onload = () => {
          const editor = ace.edit("editor", {
            mode: "ace/mode/html",
            showPrintMargin: false,
          });

          editor.setValue(initialHTML, -1);

          // Restore cursor and scroll
          editor.focus();
          editor.moveCursorToPosition(
            editor.session.doc.indexToPosition(cursorPos, 0)
          );
          editor.session.setScrollTop(scrollTop);

          const bar = document.getElementById("updateBar");
          let timer = null;
          const fillTime = 2.0;

          editor.session.on("change", () => {
            if (timer) clearInterval(timer);

            let elapsed = 0;
            bar.style.width = "0%";

            timer = setInterval(() => {
              elapsed += 0.05;
              const pct = Math.min(elapsed / fillTime, 1) * 100;
              bar.style.width = pct + "%";
              bar.textContent = `Updating in ${(fillTime - elapsed).toFixed(
                1
              )}s`;

              if (elapsed >= fillTime) {
                clearInterval(timer);

                const pos = editor.getCursorPosition();
                cursorPos = editor.session.doc.positionToIndex(pos, 0);
                scrollTop = editor.session.getScrollTop();

                let html = editor.getSession().getValue();
                html = replaceVariablesInHTML(html, [
                  { name: "cursorPos", value: cursorPos },
                  { name: "scrollTop", value: scrollTop },
                ]);

                const audio = new Audio(
                  "https://www.soundjay.com/buttons/sounds/button-3.mp3"
                );
                audio.play();

                document.open();
                document.write(html);
                document.close();
              }
            }, 50);
          });
        };

        document.head.appendChild(aceScript);
      }

      yeah();
    </script>
  </body>
</html>
