<html>
  <head>
    <title>CodeMirror Example</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/theme/monokai.min.css"
    />
    <style>
      html,
      body,
      .CodeMirror {
        margin: 0;
        height: 100%;
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <textarea id="editor"></textarea>
    <script>
      function main() {
        const b = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/",
          scripts = [
            "codemirror.min.js",
            "mode/xml/xml.min.js",
            "mode/javascript/javascript.min.js",
            "mode/css/css.min.js",
            "mode/htmlmixed/htmlmixed.min.js",
          ];
        (function load(i) {
          if (i >= scripts.length)
            return CodeMirror.fromTextArea(document.getElementById("editor"), {
              lineNumbers: true,
              mode: "htmlmixed",
              theme: "monokai",
            });
          let s = document.body.appendChild(document.createElement("script"));
          s.src = b + scripts[i];
          s.onload = () => load(i + 1);
        })(0);
      }
      main();
    </script>
  </body>
</html>
