<html>
  <head>
    <title>CodeMirror Example</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.css"
    />

    <style>
      html,
      body,
      .CodeMirror {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <textarea id="editor"></textarea>
    <script>
      function main() {
        let html = document.documentElement.outerHTML;
        const b = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/",
          scripts = [
            "codemirror.min.js",
            "mode/xml/xml.min.js",
            "mode/javascript/javascript.min.js",
            "mode/css/css.min.js",
            "mode/htmlmixed/htmlmixed.min.js",
          ];
        (function load(i) {
          if (i >= scripts.length) {
            const ta = document.getElementById("editor");
            ta.value = html;
            const editor = CodeMirror.fromTextArea(ta, {
              lineNumbers: true,
              mode: "htmlmixed",
            });

            // Listen for changes and rewrite page
            editor.on("change", () => {
              try {
                const html = editor.getValue();
                document.open();
                document.write(html);
                document.close();
              } catch (e) {}
            });
            return;
          }
          const s = document.body.appendChild(document.createElement("script"));
          s.src = b + scripts[i];
          s.onload = () => load(i + 1);
        })(0);
      }
      main();
    </script>
  </body>
</html>
