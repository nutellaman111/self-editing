<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Editing Page</title>
    <style>
      html,
      body,
      #editor {
        margin: 0;
        height: 100%;
        width: 100%;
        font-size: 1.25rem;
      }
    </style>
    <link rel="stylesheet" href="ace.css" />
  </head>
  <body>
    <h1>hi</h1>
    <div id="editor"></div>

    <script>
      function isValidHTML(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        return !doc.querySelector("parsererror");
      }
      function yeah() {
        console.log("yeah");
        let edited = false;
        let initialHTML = document.documentElement.outerHTML;

        const aceScript = document.createElement("script");
        aceScript.src =
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js";

        aceScript.onload = () => {
          const editor = ace.edit("editor", {
            mode: "ace/mode/html",
            showPrintMargin: false,
          });

          // Load the full initial HTML
          editor.setValue(initialHTML, -1);

          editor.session.on("change", () => {
            edited = true;
          });

          editor.getSession().on("changeAnnotation", () => {
            const annotations = editor.getSession().getAnnotations();
            const hasErrors = annotations.some((a) => a.type === "error");

            const html = editor.getValue();
            let isValid = isValidHTML(html);

            if (!hasErrors && isValid && edited) {
              // Replace the page while keeping the editor alive
              console.log("writing html");
              document.open();
              document.write(html);
              document.close();
            }
          });

          console.log("no errors");
          /*
           */
        };
        document.head.appendChild(aceScript);
      }
      yeah();
    </script>
  </body>
</html>
