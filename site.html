<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Most Open Source Website Ever</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/nutellaman111/self-editing@main/ace.css"
    />
    <style>
      /*∘₊✧──────────────────❤️❤️❤️CSS❤️❤️❤️──────────────────✧₊∘*/

      /* ➽───❥ intro*/
      #intro {
        display: flex;
        padding: 20px;
        font-size: 1.5rem;
        gap: 20px;
      }
      img {
        max-width: 722px;
      }

      /* ➽───❥ page & code editor*/
      html,
      body,
      #editor {
        margin: 0;
        height: 100%;
        width: 100%;
        background: #202020;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        color: white;
      }

      /* ➽───❥ the floating panel and the stuff inside it*/
      /*the panel itself*/
      #floatingPanel {
        position: fixed;
        top: -100%;
        left: -100%;
        width: 30%; /*make this bigger to play page inception*/
        background: #535353;
        padding: 10px;
        border-radius: 8px;
        z-index: 1000;
        cursor: grab;
        display: flex;
        flex-direction: column;
        gap: 5px;
        user-select: none;
        color: black;
        font-size: 1.25rem;
      }

      /*the ⠿ symbol thing*/
      #grip {
        width: 16px;
        height: 16px;
        margin: 0 auto;
        writing-mode: vertical-rl;
      }

      /*apply button*/
      #applyBtn {
        padding: 5px 10px;
        cursor: pointer;
        background: #4f0b5e;
        color: white;
        font-family: inherit;
      }
      #applyBtn:disabled {
        cursor: not-allowed;
        background: #48354d;
        color: rgb(45, 45, 45);
      }

      /*dummy element that reserves space for the preview */
      .previewDummy {
        width: 100%;
        position: relative;
      }

      /*the actual preview*/
      .previewIframe {
        position: absolute;
        box-sizing: border-box;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transform-origin: 0 0;
        background: #202020;
        border-width: 10px;
        border-style: inset;
        border-color: #7a7a7a #777 #777 #7a7a7a;
      }

      /* ➽───❥ tooltip that says where elements are defined*/
      #tooltip {
        top: -100%;
        left: -100%;
        position: fixed;
        pointer-events: none;
        color: #eee;
        padding: 4px 6px;
        font-size: 12px;
        z-index: 9999;
        backdrop-filter: blur(5px);
      }
    </style>
  </head>
  <body>
    <!-- *∘₊✧>──────────────────❤️❤️❤️BODY❤️❤️❤️──────────────────✧₊∘* -->

    <!-- ➽───❥ intro!!! you can delete this!!!!!-->
    <div id="intro">
      <img
        id="kitty"
        src="https://cdn.jsdelivr.net/gh/nutellaman111/self-editing@main/kitty.gif"
      />
      <div id="introText">
        <img
          id="title"
          src="https://cdn.jsdelivr.net/gh/nutellaman111/self-editing@main/title.gif"
        />
        <p id="thecode">
          The code below is the entire source of THIS very page!
          <br />
          If you make changes to it, the page will update live.
        </p>
        <div id="todismiss">
          To dismiss this message just delete it, its around line 120. music is
          around there too
        </div>
      </div>
    </div>

    <!-- ➽───❥ music!!!!!!!! delete to mute forever!!!!! -->
    <audio id="music" autoplay="" loop="" volume="0.1">
      <source type="audio/ogg" />
    </audio>

    <!-- ➽───❥ ace code editor -->
    <div id="editor"></div>

    <!-- ➽───❥ floaty panel -->
    <div id="floatingPanel">
      <div id="grip">⠿</div>
      <button id="applyBtn" disabled="">
        Apply Changes (Shortcut: CTRL+S)
      </button>
      <div id="previewText">preview:</div>
    </div>

    <!-- ➽───❥ the tooltip thing that says where elements are defined -->
    <div id="tooltip"></div>

    <script>
      // *∘₊✧>──────────────────❤️❤️❤️SCRIPT❤️❤️❤️──────────────────✧₊∘*

      LETSGO(); // all variables have to be declared inside some function or everything breaks
      async function LETSGO() {
        // ➽───❥ capture the page's html before scripts modify it
        let initialHTML = document.documentElement.outerHTML;

        // ➽───❥ state variable declarations that get patched when applying changes
        let cursorPos = 0;
        let scrollPos = 0;
        let panelTop = window.innerHeight * 0.5;
        let panelLeft = window.innerWidth * 0.65;
        let isPreview = false;
        let musicIndex = 0;

        // ➽───❥ sfx + music! (doesnt play in the preview)

        const filehost = `https://cdn.jsdelivr.net/gh/nutellaman111/self-editing@main/`;
        let playlist = ["password", "bccgs", "fishylove", "moredata"];
        if (!isPreview) {
          Object.assign(new Audio(filehost + "bell.ogg"), {
            volume: 0.2,
          }).play();

          let music = document.getElementById("music");
          if (music) {
            music.volume = 0.3;
            music.src = filehost + playlist[musicIndex] + `.ogg`;

            document.addEventListener(
              "click",
              () => {
                music.play();
              },
              { once: true }
            );
          }
        }

        // ➽───❥ load "ace" code editor from cdn and put the html inside

        await loadScripts([
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.0/ace.js",
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.0/theme-ambiance.min.js",
        ]);

        const editor = ace.edit("editor", {
          mode: "ace/mode/html",
          showPrintMargin: false,
          theme: "ace/theme/ambiance",
          value: initialHTML,
          fontSize: "1.25rem",
        });

        // ➽───❥ restore scrollbar and cursor positions from last render

        editor.moveCursorToPosition(
          editor.session.doc.indexToPosition(cursorPos, 0)
        );
        if (!isPreview) editor.focus();

        setTimeout(() => {
          editor.session.setScrollTop(scrollPos);
        }, 0);

        // ➽───❥ whenever the code gets edited the preview is updated

        editor.session.on("change", () => {
          updatePreview();
          updateTooltip();
        });

        // ➽───❥ initialise the floating draggable pannel

        const floatingPanel = document.getElementById("floatingPanel");
        floatingPanel.style.top = panelTop + "px";
        floatingPanel.style.left = panelLeft + "px";
        makePanelDraggable(floatingPanel);

        // ➽───❥ when the "apply changes" button is pressed (or ctrl+enter):
        //        the html of the entire page really does get replaced with what you have written down in the code editor

        const applyChanges = () => {
          let newHtml = getHtmlFromEditorAndApplyPatches(isPreview);
          document.open();
          document.write(newHtml);
          document.close();
        };

        document
          .getElementById("applyBtn")
          .addEventListener("click", applyChanges);

        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey && e.key.toLowerCase() === "s") {
            e.preventDefault();
            applyChanges();
          }
        });

        // ➽───❥ create an iframe preview of what the page will look like if "apply" is pressed.
        //        the timeout thing makes the iframe not update every 0.00000001 seconds

        let previewIframe = null;
        let editTimeout;
        function updatePreview() {
          clearTimeout(editTimeout);
          editTimeout = setTimeout(
            () => {
              applyBtn.disabled = false;

              if (!previewIframe) {
                const aspectRatio = window.innerHeight / window.innerWidth;

                // ➽───❥ the iframe is rendered at screen resolution then shrinked down with css.
                //        the html layout doesnt account for transformations, so what i do is -
                //        1. render a dummy element to reserve space in the layout,
                //        2. position the iframe on top of it

                const dummy = document.createElement("div");
                dummy.className = "previewDummy";
                dummy.style.paddingTop = `${aspectRatio * 100}%`;
                floatingPanel.appendChild(dummy);

                previewIframe = document.createElement("iframe");
                previewIframe.className = "previewIframe";

                const scaleX = dummy.clientWidth / window.innerWidth;
                const scaleY = dummy.clientHeight / window.innerHeight;
                const scale = Math.min(scaleX, scaleY);
                previewIframe.style.transform = `scale(${scale})`;

                dummy.appendChild(previewIframe);
              }

              previewIframe.srcdoc = getHtmlFromEditorAndApplyPatches(true);
            },
            previewIframe ? 500 : 0
          );
        }

        // ➽───❥ this function gets whatever is written down in the code editor and returns it after making some patches......
        //        ok so like normally when u replace some page's entire html, things like cursor position get reset.
        //        which is annoying.
        //        so we have to somehow tell the next version of the page where the cursor and stuff were.
        //        we do that by patching the variable declarations at the start.
        //        for example "let cursorPos = 0;" turns into "let cursorPos = 67;"

        function getHtmlFromEditorAndApplyPatches(patchAsPreview = false) {
          return patchHtml(editor.getSession().getValue(), [
            {
              name: "cursorPos",
              value: editor.session.doc.positionToIndex(
                editor.getCursorPosition(),
                0
              ),
            },
            { name: "isPreview", value: patchAsPreview },
            { name: "scrollPos", value: editor.session.getScrollTop() },
            { name: "panelTop", value: floatingPanel.offsetTop },
            { name: "panelLeft", value: floatingPanel.offsetLeft },
            { name: "musicIndex", value: (musicIndex + 1) % playlist.length },
          ]);
        }

        function patchHtml(html, replacements) {
          replacements.forEach(({ name, value }) => {
            const regex = new RegExp(`let\\s+${name}\\s*=\\s*[^;]*;`);
            html = html.replace(regex, `let ${name} = ${value};`);
          });
          return html;
        }

        // ➽───❥ tooltip!
        //        when you hover over an element, it says where it is

        const tooltip = document.getElementById("tooltip");
        let tooltipElement = null;

        document.addEventListener("mousemove", (e) => {
          tooltip.style.left = e.clientX + 12 + "px";
          tooltip.style.top = e.clientY + 12 + "px";
        });

        document.addEventListener("mouseover", (e) => {
          tooltipElement = e.target;
          updateTooltip();
        });
        function updateTooltip() {
          tooltip.style.display =
            tooltipElement.tagName === "IFRAME" ? "none" : "block";
          tooltip.textContent = `defined at line ${findWhereElementIsDefined(
            tooltipElement,
            editor.getSession().getValue()
          )}`;
        }
      }

      // ➽───❥ some helper functions

      //find out on which line an element is defined by searching for [id="1234"]
      //if its not found we try looking for its ancestors until we find something
      function findWhereElementIsDefined(el, html) {
        while (el) {
          if (el.id) {
            const needle = `id="${el.id}"`;
            const idx = html.indexOf(needle);
            if (idx !== -1) {
              return html.slice(0, idx).split("\n").length;
            }
          }
          el = el.parentElement;
        }
        return null;
      }

      /*makes the preview pannel movable*/
      function makePanelDraggable(el) {
        let offsetX = 0,
          offsetY = 0,
          dragging = false;

        el.addEventListener("mousedown", (e) => {
          dragging = true;
          offsetX = e.clientX - el.offsetLeft;
          offsetY = e.clientY - el.offsetTop;
          el.style.cursor = "grabbing";
        });

        document.addEventListener("mouseup", () => {
          dragging = false;
          el.style.cursor = "grab";
        });

        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          el.style.left = e.clientX - offsetX + "px";
          el.style.top = e.clientY - offsetY + "px";
        });
      }

      /*attaches an array scripts to the html's head in order*/
      async function loadScripts(urls) {
        for (const url of urls) {
          await new Promise((res, rej) => {
            const s = document.createElement("script");
            s.src = url;
            s.async = false;
            s.onload = res;
            document.head.appendChild(s);
          });
        }
      }
    </script>
  </body>
</html>
