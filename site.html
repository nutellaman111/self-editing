<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Editing Page</title>
    <link rel="stylesheet" href="ace.css" />
  </head>
  <body>
    <div id="editor"></div>

    <div id="floatingPanel">
      <button id="applyBtn" disabled>Apply Changes</button>
      <!-- Preview iframe will go here later -->
    </div>

    <script>
      function applyStyles() {
        Object.assign(document.documentElement.style, {
          margin: "0",
          height: "1000vh",
          width: "100%",
        });

        Object.assign(document.body.style, {
          margin: "0",
          height: "100%",
          width: "100%",
        });

        Object.assign(document.getElementById("editor").style, {
          height: "100%",
          width: "100%",
          fontSize: "1.25rem",
          height: "100%",
        });

        Object.assign(document.getElementById("floatingPanel").style, {
          position: "fixed",
          top: "20px",
          left: "20px",
          background: "gray",
          padding: "20px",
          borderRadius: "8px",
          zIndex: "1000",
          cursor: "grab",
          display: "flex",
          flexDirection: "column",
          gap: "10px",
        });

        const applyBtn = document.getElementById("applyBtn");
        Object.assign(applyBtn.style, {
          padding: "5px 10px",
          fontSize: "1rem",
          cursor: "pointer",
        });

        applyBtn.disabled = true;
        applyBtn.style.background = "#555";
        applyBtn.style.cursor = "not-allowed";
      }

      function replaceVariablesInHTML(html, replacements) {
        replacements.forEach(({ name, value }) => {
          const regex = new RegExp(`let\\s+${name}\\s*=\\s*[^;]*;`);
          html = html.replace(regex, `let ${name} = ${value};`);
        });
        return html;
      }

      function makeDraggable(el) {
        let offsetX = 0,
          offsetY = 0,
          dragging = false;

        el.addEventListener("mousedown", (e) => {
          dragging = true;
          offsetX = e.clientX - el.offsetLeft;
          offsetY = e.clientY - el.offsetTop;
          el.style.cursor = "grabbing";
        });

        document.addEventListener("mouseup", () => {
          dragging = false;
          el.style.cursor = "grab";
        });

        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          el.style.left = e.clientX - offsetX + "px";
          el.style.top = e.clientY - offsetY + "px";
        });
      }

      function yeah() {
        let cursorPos = 0;
        let scrollPos = 0;
        let initialHTML = document.documentElement.outerHTML;
        let changesMade = false;

        applyStyles();

        const aceScript = document.createElement("script");
        aceScript.src =
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js";

        aceScript.onload = () => {
          const editor = ace.edit("editor", {
            mode: "ace/mode/html",
            showPrintMargin: false,
          });

          editor.setValue(initialHTML, -1);
          editor.focus();
          editor.moveCursorToPosition(
            editor.session.doc.indexToPosition(cursorPos, 0)
          );
          window.scrollTo(0, scrollPos);

          const applyBtn = document.getElementById("applyBtn");

          editor.session.on("change", () => {
            changesMade = true;
            applyBtn.disabled = false;
            applyBtn.style.background = "";
            applyBtn.style.cursor = "pointer";
          });

          applyBtn.addEventListener("click", () => {
            if (!changesMade) return;

            const pos = editor.getCursorPosition();
            cursorPos = editor.session.doc.positionToIndex(pos, 0);
            scrollPos = window.scrollY;

            let html = editor.getSession().getValue();
            html = replaceVariablesInHTML(html, [
              { name: "cursorPos", value: cursorPos },
              { name: "scrollPos", value: scrollPos },
            ]);

            document.open();
            document.write(html);
            document.close();
          });
        };

        document.head.appendChild(aceScript);
      }

      makeDraggable(document.getElementById("floatingPanel"));
      yeah();
    </script>
  </body>
</html>
