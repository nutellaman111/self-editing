<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Editing Page</title>
    <style>
      html,
      body,
      #editor {
        margin: 0;
        height: 100%;
        width: 100%;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
    <p>Edit this text and see it update live.</p>

    <div id="editor"></div>

    <script>
      const aceScript = document.createElement("script");
      aceScript.src =
        "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js";
      aceScript.async = true; // optional but recommended

      aceScript.onload = () => {
        console.log("meow"); // this should run when Ace loads
        // You can safely use ace here
      };

      aceScript.onerror = () => {
        console.error("Failed to load Ace script");
      };

      document.head.appendChild(aceScript);
    </script>
  </body>
</html>
