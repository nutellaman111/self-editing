<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Editing Page</title>
    <link rel="stylesheet" href="ace.css" />
    <!--https://cdn.jsdelivr.net/gh/nutellaman111/self-editing@main/ace.css-->
    <style>
      html,
      body,
      #editor {
        margin: 0;
        height: 100%;
        width: 100%;
        font-size: 1rem;
      }

      #floatingPanel {
        position: fixed;
        top: -100%;
        left: -100%;
        width: 30%;
        background: gray;
        padding: 20px;
        border-radius: 8px;
        z-index: 1000;
        cursor: grab;
        display: flex;
        flex-direction: column;
        gap: 10px;
        user-select: none;
      }

      #applyBtn {
        padding: 5px 10px;
        cursor: not-allowed;
        background: #555;
      }

      #grip {
        width: 16px;
        height: 16px;
        margin: 0 auto;
        user-select: none;
        pointer-events: none;
      }

      /* Optional: preview iframe scaling container */
      .previewDummy {
        width: 100%;
        position: relative;
      }

      .previewIframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transform-origin: 0 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>

    <div id="floatingPanel">
      <img
        id="grip"
        src="https://cdn.jsdelivr.net/gh/nutellaman111/self-editing@main/grip.svg"
      />
      <button id="applyBtn" disabled="">Apply Changes</button>
      preview:
    </div>

    <script>
      function replaceVariablesInHTML(html, replacements) {
        replacements.forEach(({ name, value }) => {
          const regex = new RegExp(`let\\s+${name}\\s*=\\s*[^;]*;`);
          html = html.replace(regex, `let ${name} = ${value};`);
        });
        return html;
      }

      function yeah() {
        let cursorPos = 0;
        let scrollPos = 0;
        let panelTop = 20;
        let autoFocus = true;
        let panelLeft = window.innerWidth / 2; // 50px from right
        let initialHTML = document.documentElement.outerHTML;
        let changesMade = false;

        const aceScript = document.createElement("script");
        aceScript.src =
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js";

        const aceScript2 = document.createElement("script");
        aceScript2.src =
          "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/theme-ambiance.min.js";

        aceScript.onload = () => {
          const editor = ace.edit("editor", {
            mode: "ace/mode/html",
            showPrintMargin: false,
            theme: "ambiance",
            value: initialHTML,
          });
          editor.moveCursorToPosition(
            editor.session.doc.indexToPosition(cursorPos, 0)
          );
          if (autoFocus) editor.focus();

          const applyBtn = document.getElementById("applyBtn");
          const floatingPanel = document.getElementById("floatingPanel");

          floatingPanel.style.top = panelTop + "px";
          floatingPanel.style.left = panelLeft + "px";

          setTimeout(() => {
            editor.session.setScrollTop(scrollPos);
          }, 0);

          function makeDraggable(el) {
            let offsetX = 0,
              offsetY = 0,
              dragging = false;

            el.addEventListener("mousedown", (e) => {
              dragging = true;
              offsetX = e.clientX - el.offsetLeft;
              offsetY = e.clientY - el.offsetTop;
              el.style.cursor = "grabbing";
            });

            document.addEventListener("mouseup", () => {
              dragging = false;
              el.style.cursor = "grab";
            });

            document.addEventListener("mousemove", (e) => {
              if (!dragging) return;
              el.style.left = e.clientX - offsetX + "px";
              el.style.top = e.clientY - offsetY + "px";
            });
          }
          makeDraggable(floatingPanel);

          let previewIframe = null;

          editor.session.on("change", () => {
            onEdit();
          });

          let editTimeout;
          function onEdit() {
            clearTimeout(editTimeout);
            editTimeout = setTimeout(
              () => {
                changesMade = true;
                applyBtn.disabled = false;
                applyBtn.style.background = "";
                applyBtn.style.cursor = "pointer";

                if (!previewIframe) {
                  const aspectRatio = window.innerHeight / window.innerWidth;

                  const dummy = document.createElement("div");
                  dummy.className = "previewDummy";
                  dummy.style.paddingTop = `${aspectRatio * 100}%`;
                  floatingPanel.appendChild(dummy);

                  previewIframe = document.createElement("iframe");
                  previewIframe.className = "previewIframe";

                  const scaleX = dummy.clientWidth / window.innerWidth;
                  const scaleY = dummy.clientHeight / window.innerHeight;
                  const scale = Math.min(scaleX, scaleY);
                  previewIframe.style.transform = `scale(${scale})`;

                  dummy.appendChild(previewIframe);
                }

                previewIframe.srcdoc = getModifiedHtml(false);
              },
              previewIframe ? 500 : 0
            );
          }

          applyBtn.addEventListener("click", () => {
            if (!changesMade) return;

            let newHtml = getModifiedHtml();

            document.open();
            document.write(newHtml);
            document.close();
          });

          function getModifiedHtml(autoFocus = true) {
            return replaceVariablesInHTML(editor.getSession().getValue(), [
              {
                name: "cursorPos",
                value: editor.session.doc.positionToIndex(
                  editor.getCursorPosition(),
                  0
                ),
              },
              { name: "autoFocus", value: autoFocus },
              { name: "scrollPos", value: editor.session.getScrollTop() },
              { name: "panelTop", value: floatingPanel.offsetTop },
              { name: "panelLeft", value: floatingPanel.offsetLeft },
            ]);
          }
        };

        document.head.appendChild(aceScript);
        document.head.appendChild(aceScript2);
      }

      yeah();
    </script>
  </body>
</html>
