<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Editing Page</title>
    <style>
      html,
      body,
      #editor {
        margin: 0;
        height: 100%;
        width: 100%;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
    <p>Edit this text and see it update live.</p>

    <div id="editor"></div>

    <script>
      const aceScript = document.createElement("script");
      aceScript.src =
        "https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js";

      aceScript.onload = () => {
        console.log("meow");

        const editor = ace.edit("editor", {
          mode: "ace/mode/html",
          showPrintMargin: false,
        });

        // Load the full initial HTML
        editor.setValue(initialHTML, -1);

        const Range = ace.require("ace/range").Range;
        const start = parseInt(localStorage.getItem("cursorStart"), 10) || 0;
        const end = parseInt(localStorage.getItem("cursorEnd"), 10) || 0;
        const posStart = editor.session.doc.indexToPosition(start, 0);
        const posEnd = editor.session.doc.indexToPosition(end, 0);
        editor.selection.setRange(
          new Range(posStart.row, posStart.column, posEnd.row, posEnd.column)
        );
        editor.focus();

        editor.session.on("change", () => {
          const sel = editor.selection.getRange();
          const start = editor.session.doc.positionToIndex(sel.start, 0);
          const end = editor.session.doc.positionToIndex(sel.end, 0);
          localStorage.setItem("cursorStart", start);
          localStorage.setItem("cursorEnd", end);

          const html = editor.getValue();

          // Replace the page while keeping the editor alive
          document.open();
          document.write(html);
          document.close();
        });
      };
    </script>
  </body>
</html>
